name: autopredict_app
description: AutoPredict — Smart Vehicle Diagnostics & AI Service Booking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.1

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  web_socket_channel: ^2.4.0

  # Charts & animations
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # SVG
  flutter_svg: ^2.0.10+1

  # Storage & cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3

  # Fonts & icons
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1

  # AI
  google_generative_ai: ^0.4.3

  # Voice (speech_to_text removed — v1 embedding incompatible)
  flutter_tts: ^4.0.2

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Sensors (crash detection)
  sensors_plus: ^4.0.2
  flutter_secure_storage: ^9.2.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/images/
    - assets/lottie/
